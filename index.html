<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:">
<title>클로드 모니터링</title>
<style>
  /* 항상 짙은 회색 테마 (시스템 테마와 무관) */
  :root {
    color-scheme: dark;
    --bg: #262626; --card: #303030; --line: #444444; --text: #ececec; --sub: #a0a0a0;
    --accent: #e08a63; --red: #e5584f; --green: #3fb37f; --gray: #8a8a8a; --amber: #e0a03a;
    --red-bg: #3d2a28; --green-bg: #263a2f; --gray-bg: #383838;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45;
    font-family: Pretendard, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; overflow: hidden; user-select: none;
  }
  .stats { display: flex; gap: 6px; padding: 2px 14px 4px; flex: none; }
  .stat { flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 6px; padding: 5px 7px;
    background: var(--card); }
  .stat .n { font: 700 15px/1.2 "JetBrains Mono", Consolas, monospace; color: var(--text); }
  .stat .l { font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.attn .n { color: var(--red); }
  .stat.run .n { color: var(--green); }
  .stat.zero .n { color: var(--sub); }
  .grip { height: 16px; flex: none; display: flex; justify-content: center; align-items: center; -webkit-app-region: drag; cursor: grab; }
  .grip::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: var(--line); }
  header { padding: 6px 18px 12px; position: relative; }
  #pin {
    position: absolute; top: 2px; right: 12px; width: 32px; height: 32px; min-height: 0; padding: 0;
    display: grid; place-items: center; border-radius: 8px; border-color: transparent;
    color: var(--sub); z-index: 2;
  }
  #pin svg { transform: rotate(45deg); transition: transform .15s; }
  #pin:hover { color: var(--accent); border-color: var(--line); }
  /* 고정됨: 주황 채움 버튼 + 창 테두리 + 라벨로 한눈에 구분 */
  #pin.on { color: #fff; background: var(--accent); border-color: var(--accent); }
  #pin.on svg { transform: rotate(0); fill: currentColor; }
  body.pinned { box-shadow: inset 0 0 0 2px var(--accent); }
  .app-name span { color: var(--sub); font-weight: 600; margin-left: 6px; }
  .app-name { font-size: 12px; font-weight: 700; color: var(--accent); margin: 0 0 8px; letter-spacing: .02em; }
  .summary { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
  .summary .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--gray); flex: none; }
  .summary.attn .dot { background: var(--red); box-shadow: 0 0 0 4px var(--red-bg); }
  .summary.run .dot { background: var(--green); box-shadow: 0 0 0 4px var(--green-bg); }
  .hint { color: var(--sub); font-size: 12.5px; margin-top: 4px; padding-left: 22px; }
  main { flex: 1; overflow-y: auto; padding: 0 14px 10px; }
  section { margin-top: 12px; }
  .group-title {
    display: flex; align-items: center; gap: 6px; padding: 0 4px 6px;
    font-size: 12px; font-weight: 700; color: var(--sub); letter-spacing: .02em;
  }
  .group-title .count { background: var(--gray-bg); border-radius: 10px; padding: 0 7px; font-weight: 600; }
  .group-title.fold { cursor: pointer; }
  .group-title.fold::after { content: "▾"; margin-left: auto; }
  .group-title.fold.closed::after { content: "▸"; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
  }
  .card.attn { border-color: var(--red); }
  .badge { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--gray); }
  .attn .badge { background: var(--red); } .run .badge { background: var(--green); }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta.git { white-space: normal; margin-top: 1px; }
  .meta .dir { font-weight: 700; color: var(--text); }
  .meta .br { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11.5px; }
  .meta .br.warn { color: var(--amber); font-weight: 700; }
  .meta .chg { color: var(--amber); font-weight: 600; }
  .meta .ok { color: var(--green); }
  .usage { flex: none; border-top: 1px solid var(--line); padding: 8px 18px; display: grid; gap: 9px; }
  .u-row { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 12px; }
  .u-row .t { color: var(--sub); font-weight: 600; }
  .u-row .p { font-weight: 700; font-variant-numeric: tabular-nums; }
  .u-row .r { grid-column: 1 / -1; color: var(--sub); font-size: 11.5px; }
  .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--gray-bg); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); border-radius: 3px; }
  .bar i.warn { background: var(--amber); }
  .bar i.hot { background: var(--red); }
  .u-empty { color: var(--sub); font-size: 12px; }
  .ctx.warn { color: var(--amber); font-weight: 600; }
  .ctx.hot { color: var(--red); font-weight: 700; }
  .hint2 { color: var(--sub); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint2 b { color: var(--text); font-weight: 600; margin-right: 4px; }
  .name.untitled { color: var(--sub); font-weight: 600; }
  #synced { text-align: right; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--gray-bg);
    border-radius: 6px; padding: 0 6px; margin-right: 6px; vertical-align: 1px; }
  .card.agent { margin-left: 12px; padding: 8px 12px; }
  .name-edit { width: 100%; font: inherit; font-weight: 700; color: var(--text); background: var(--bg);
    border: 1px solid var(--accent); border-radius: 6px; padding: 2px 6px; outline: none; user-select: text; }
  .meta { color: var(--sub); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state { font-weight: 600; }
  .attn .state { color: var(--red); } .run .state { color: var(--green); }
  button {
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; flex: none;
    border: 1px solid var(--line); background: transparent; color: var(--sub);
    border-radius: 8px; padding: 6px 10px; min-height: 30px;
  }
  button:hover { color: var(--red); border-color: var(--red); }
  button.confirm { background: var(--red); border-color: var(--red); color: #fff; }
  .empty { text-align: center; color: var(--sub); padding: 48px 0; }
  .empty b { display: block; font-size: 15px; color: var(--text); margin-bottom: 4px; }
  footer {
    padding: 9px 18px; border-top: 1px solid var(--line); color: var(--sub); font-size: 11.5px;
    -webkit-app-region: drag;
    display: flex; justify-content: space-between;
  }
  #toast {
    position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); background: var(--text);
    color: var(--bg); padding: 8px 14px; border-radius: 20px; font-size: 12.5px; opacity: 0;
    transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="grip" title="드래그해서 옮기기"></div>
  <div id="stats" class="stats"></div>
  <header>
    <button id="pin" title="화면에 고정 (바깥을 눌러도 닫히지 않아요)" aria-label="화면에 고정">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg>
    </button>
    <div class="app-name">클로드 모니터링<span id="pinLabel"></span></div>
    <div id="summary" class="summary"><span class="dot"></span><span id="title">불러오는 중…</span></div>
    <div id="hint" class="hint"></div>
  </header>
  <main id="list"></main>
  <div id="usage" class="usage"></div>
  <footer><span id="count"></span><span id="synced"></span></footer>
  <div id="toast"></div>

<script src="renderer.js"></script>
</body>
</html>
